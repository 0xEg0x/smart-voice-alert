[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[1000]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=1000-auth
aors=1000  ; <-- Mude para 1000 (sem -aor)
direct_media=no
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
from_user=1000  ; <-- Mantenha isso (ajuda em matching outbound/inbound)

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=1000

[1000]  ; <-- Renomeie de [1000-aor] para [1000]
type=aor
max_contacts=1
remove_existing=yes
